site_name: django-native-jsonform
site_description: Native, customizable Django forms generated from JSON Schema
site_url: https://barcelona-dev.github.io/django-native-jsonform/
repo_url: https://github.com/Barcelona-DEV/django-native-jsonform
repo_name: Barcelona-DEV/django-native-jsonform
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Barcelona DEV

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quick-start.md
      - Django admin: admin.md
  - Guide:
      - Supported JSON Schema: schema-reference.md
      - Per-path customization: customization.md
      - Dynamic schemas and context: dynamic-schemas.md
      - Validation: validation.md
      - Rendering and templates: rendering.md
      - Building extensions: extensions.md
  - Reference:
      - Public API: api-reference.md
      - Architecture: architecture.md
      - Settings and compatibility: compatibility.md
      - FAQ: faq.md
  - Project:
      - Migrate from django-jsonform: migration.md
      - Contributing: contributing.md
      - Release and PyPI publishing: publishing.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
