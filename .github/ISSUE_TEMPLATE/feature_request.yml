name: Feature request
description: Propose a portable capability or extension point
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What application need cannot be expressed today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Include a schema/form example when possible.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Portable core behavior
        - Registry extension
        - Rendering/design system
        - Documentation
    validations:
      required: true
