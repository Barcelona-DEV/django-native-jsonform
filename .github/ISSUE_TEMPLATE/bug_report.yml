name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve django-native-jsonform.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package, Django, and Python versions
      placeholder: django-native-jsonform 0.1.1, Django 6.0, Python 3.12
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: Minimal schema and form
      render: python
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or rendered HTML
      render: shell
